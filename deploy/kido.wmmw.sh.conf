# kido.wmmw.sh -> Bun app (docker compose) on 127.0.0.1:4371
# Hand-managed vhost (not Cloudron). TLS by certbot (webroot renewals).
server {
    listen 80;
    listen [::]:80;
    server_name kido.wmmw.sh;
    location /.well-known/acme-challenge/ {
        root /var/www/kido-acme;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kido.wmmw.sh;

    ssl_certificate     /etc/letsencrypt/live/kido.wmmw.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kido.wmmw.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:kidoSSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 64k;

    # SSE stream and long-poll: no buffering, long reads
    location ~ ^/api/games/[^/]+/(events|wait)$ {
        proxy_pass http://127.0.0.1:4371;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4371;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
